name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test build --console=plain -Dhttps.protocols=TLSv1.2
      - uses: actions/upload-artifact@v4
        with:
          name: trueaura-forge-1.20.1
          path: build/libs/*.jar
